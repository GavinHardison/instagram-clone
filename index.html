<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        <script src="index.js" defer></script>
    </head>
    <body>

        <div class="viewport">
            <header>
                <img src="images/logo.png" alt="Oldagram logo" class="logo">
                <img src="images/user-avatar.png" alt="User profile picture"
                    class="icon">
            </header>

            <div class="post" id="van-gogh">
                <div class="post-header">
                    <img src="" alt="Van Gogh Profile Picture"
                        class="icon">
                    <div class="post-info">
                        <p class="bold name"></p>
                        <p class="normal location"></p>
                    </div>
                </div>
                <img class="post-img" src="" alt="A portrait of Van Gogh">
                <div class="post-footer">
                    <div class="post-interactions">
                        <img class="post-button heart" src="images/icon-heart.png" alt="Like button icon">
                        <img class="post-button" src="images/icon-comment.png" alt="Comment button icon">
                        <img class="post-button" src="images/icon-dm.png" alt="Direct message button icon">                    
                    </div>
                    <p class="bold likes"> likes</p>
                    <p><span class="bold username"></span> <span class="normal comment"></span></p>
                </div>
            </div>

            <div class="divider"></div>

            <div class="post" id="courbet">
                <div class="post-header">
                    <img src="" alt="Gustave Courbet Profile Picture"
                        class="icon">
                    <div class="post-info">
                        <p class="bold name"></p>
                        <p class="normal location"></p>
                    </div>
                </div>
                <img class="post-img" src="" alt="A portrait of Gustave Courbet">
                <div class="post-footer">
                    <div class="post-interactions">
                        <img class="post-button heart" src="images/icon-heart.png" alt="Like button icon">
                        <img class="post-button" src="images/icon-comment.png" alt="Comment button icon">
                        <img class="post-button" src="images/icon-dm.png" alt="Direct message button icon">                    
                    </div>
                    <p class="bold likes"> likes</p>
                    <p><span class="bold username"></span> <span class="normal comment"></span></p>
                </div>
            </div>

            <div class="divider"></div>

            <div class="post" id="ducreux">
                <div class="post-header">
                    <img src="" alt="Joseph Ducreux Profile Picture"
                        class="icon">
                    <div class="post-info">
                        <p class="bold name"></p>
                        <p class="normal location"></p>
                    </div>
                </div>
                <img class="post-img" src="" alt="A portrait of Joseph Ducreux">
                <div class="post-footer">
                    <div class="post-interactions">
                        <img class="post-button heart" src="images/icon-heart.png" alt="Like button icon">
                        <img class="post-button" src="images/icon-comment.png" alt="Comment button icon">
                        <img class="post-button" src="images/icon-dm.png" alt="Direct message button icon">                    
                    </div>
                    <p class="bold likes"> likes</p>
                    <p><span class="bold username"></span> <span class="normal comment"></span></p>
                </div>
            </div>
        </div>
    </body>
</html>
